services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nvwa-lite:
    build: .
    ports:
      - "8501:8501"
      # 8503 bound to localhost only — cleanup endpoint must not be publicly reachable.
      # Host nginx proxies /api/cleanup → localhost:8503 from the EC2 host network.
      - "127.0.0.1:8503:8503"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src
      - ./.streamlit:/app/.streamlit
      - ./logs:/app/logs
      - ./data/uploads:/app/data/uploads
      - ./data/preloaded:/app/data/preloaded
      - ./pilot_tokens.json:/app/pilot_tokens.json
      - ./preloaded_datasets.json:/app/preloaded_datasets.json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/app/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    build: .
    command: ["uv", "run", "streamlit", "run", "src/platform/observability/dashboard.py", "--server.port=8502", "--server.address=0.0.0.0", "--server.headless=true", "--server.baseUrlPath=/admin"]
    ports:
      - "8502:8502"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8502/admin/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis-data:
